name: Deploy HTML project to Baota Panel

on:
  push:
    branches:
      - v3  # 或者你使用的是 master 分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2


    - name: Debug KEY
      run: echo "${{ secrets.SSH_PRIVATE_KEY }}"
      run: echo "${{ secrets.SSH_USERNAME }}"
      run: echo "${{ secrets.SSH_HOST }}"

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.5.3
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # - name: Rsync files
    #   run: rsync -avz --delete ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}

