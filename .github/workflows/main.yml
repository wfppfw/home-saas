name: Deploy Nuxt.js to Server

on:
  push:
    branches:
      - main  # 触发部署的分支

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. 安装 Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22  # 根据项目需求调整 Node.js 版本

      # 3. 安装 pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 4. 安装依赖并构建项目
      - name: Install dependencies and build
        run: |
          pnpm install
          pnpm run build

      # 5. 将代码部署到服务器
      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: ./
          target: ${{ secrets.SERVER_DIR }}
          strip_components: 1  # 去除顶层目录

      # 6. 在服务器上启动 PM2
      - name: Start PM2
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.SERVER_DIR }}
            pnpm install --production
            pm2 delete nuxt-app || true  # 如果已有进程，先删除
            pm2 start pnpm --name "nuxt-app" -- start
