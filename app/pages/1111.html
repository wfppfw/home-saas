<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebContainer 简易代码编辑器</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: #1a1a1a;
        color: white;
        font-family: monospace;
      }

      #editor {
        width: 100%;
        height: 300px;
        padding: 10px;
        background: #2d2d2d;
        color: #f8f8f2;
        border: 2px solid #444;
        border-radius: 4px;
        resize: vertical;
        font-family: monospace;
        font-size: 14px;
        margin-bottom: 15px;
      }

      button {
        background: #007acc;
        color: white;
        border: none;
        padding: 10px 25px;
        cursor: pointer;
        border-radius: 4px;
        font-size: 16px;
      }

      button:hover {
        background: #0062a3;
      }

      #output {
        background: #252526;
        padding: 15px;
        border-radius: 4px;
        margin-top: 20px;
        white-space: pre-wrap;
        min-height: 100px;
      }
    </style>
  </head>
  <body>
    <textarea id="editor" spellcheck="false">
// 输入 JavaScript 代码
console.log("Hello WebContainer!");

function add(a, b) {
  return a + b;
}

console.log("2 + 3 =", add(2, 3));</textarea

    <button onclick="runCode()">运行代码</button>
    <div id="output"></div>

    <script type="module">
      import { WebContainer } from '../../node_modules/@webcontainer/api/dist/index.js'

      let webcontainerInstance
      const editor = document.getElementById('editor')
      const output = document.getElementById('output')

      // 初始化 WebContainer
      async function initWebContainer() {
        try {
          webcontainerInstance = await WebContainer.boot()
          await webcontainerInstance.mount({
            'index.js': {
              file: { contents: editor.value },
            },
          })
          console.log('WebContainer 已就绪')
        } catch (err) {
          showOutput(`初始化失败: ${err.message}`)
        }
      }

      // 运行代码
      async function runCode() {
        if (!webcontainerInstance) {
          showOutput('正在启动 WebContainer...')
          await initWebContainer()
        }

        output.textContent = '执行中...'
        const code = editor.value

        try {
          // 更新文件内容
          await webcontainerInstance.fs.writeFile('index.js', code)

        // 执行代码
          const process = await webcontainerInstance.spawn('node', ['index.js'])
          const reader = process.output.getReader()
          let result = ''

          while (true) {
            const { done, value } = await reader.read()
            if (done) break
            result += new TextDecoder().decode(value)
            output.textContent = result
          }

          await process.exit
        } catch (err) {
          showOutput(`错误: ${err.message}`)
        }
      }

      function showOutput(text) {
        output.textContent = text
      }

      // 自动初始化
      initWebContainer()
    </script>
  </body>
</html>
